name: Deploy Passion Tree AI Service

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: passiontreecontainerregistry
  IMAGE_NAME: ai-app
  CONTAINER_APP_NAME: ai-fastapi
  RESOURCE_GROUP: Passion-Tree

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push to ACR
        run: |
          ACR_SERVER="passiontreecontainerregistry.azurecr.io"
          IMAGE_NAME="passion-tree-ai"
          TAG="${{ github.sha }}"
          
          az acr login --name passiontreecontainerregistry
          docker build . -t $ACR_SERVER/$IMAGE_NAME:$TAG
          docker push $ACR_SERVER/$IMAGE_NAME:$TAG

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: passiontreecontainerregistry.azurecr.io/passion-tree-ai:${{ github.sha }}
          resourceGroup: Passion-Tree
          containerAppName: passion-tree-ai-service
          environmentVariables: |
            AI_PORT=${{ secrets.AI_PORT }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            AZURESQL_SERVER=${{ secrets.AZURESQL_SERVER }}
            AZURESQL_PASSWORD=${{ secrets.AZURESQL_PASSWORD }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}