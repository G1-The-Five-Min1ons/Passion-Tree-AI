name: Deploy Passion Tree AI Service

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: passiontreecontainerregistry
  IMAGE_NAME: passion-tree-ai
  RESOURCE_GROUP: Passion-Tree
  CONTAINER_APP_NAME: passion-tree-ai-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push to ACR
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
          TAG="${{ github.sha }}"
          
          az acr login --name ${{ env.ACR_NAME }}
          docker build . -t $ACR_SERVER/${{ env.IMAGE_NAME }}:$TAG
          docker push $ACR_SERVER/${{ env.IMAGE_NAME }}:$TAG

      - name: Set Container App Secrets
        run: |
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "azuresql-password=${{ secrets.AZURESQL_PASSWORD }}" \
              "groq-key=${{ secrets.GROQ_API_KEY }}" \
              "jina-key=${{ secrets.JINA_API_KEY }}" \
              "qdrant-key=${{ secrets.QDRANT_API_KEY }}"

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          environmentVariables: |
            AI_PORT=${{ secrets.AI_PORT }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            AZURESQL_SERVER=${{ secrets.AZURESQL_SERVER }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            AZURESQL_PASSWORD=secretref:azuresql-password
            GROQ_API_KEY=secretref:groq-key
            JINA_API_KEY=secretref:jina-key
            QDRANT_API_KEY=secretref:qdrant-key