name: Deploy Passion Tree AI Service

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: passiontreeacr
  IMAGE_NAME: passion-tree-ai
  RESOURCE_GROUP: Passion-Tree
  CONTAINER_APP_NAME: passion-tree-ai-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Image
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build . -t $IMAGE_TAG
          docker push $IMAGE_TAG
          docker tag $IMAGE_TAG ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Container App
        run: |
          if ! az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "Container App not yet created by Terraform — skipping deploy"
            exit 0
          fi

          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "groq-key=${{ secrets.GROQ_API_KEY }}" \
              "jina-key=${{ secrets.JINA_API_KEY }}" \
              "qdrant-key=${{ secrets.QDRANT_API_KEY }}"

          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --set-env-vars \
              "QDRANT_URL=${{ secrets.QDRANT_URL }}" \
              "APP_URL=https://api.passion-tree.org" \
              "AI_SERVICE_URL=https://passion-tree-ai-service" \
              "GROQ_API_KEY=secretref:groq-key" \
              "JINA_API_KEY=secretref:jina-key" \
              "QDRANT_API_KEY=secretref:qdrant-key"
