name: Sync to Hugging Face Hub
on:
  push:
    branches: [main] # ถ้า branch หลักของคุณชื่อ master ให้เปลี่ยนเป็น master นะครับ

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://farlos:$HF_TOKEN@huggingface.co/spaces/farlos/passsion-tree-ai main